[package]
name = "image"
version = "0.25.10"
edition = "2021"
resolver = "2"

# note: when changed, also update test runner in `.github/workflows/rust.yml`
rust-version = "1.88.0"

license = "MIT OR Apache-2.0"
description = "Imaging library. Provides basic image processing and encoders/decoders for common image formats."
authors = ["The image-rs Developers"]
readme = "README.md"

# crates.io metadata
documentation = "https://docs.rs/image"
repository = "https://github.com/image-rs/image"
homepage = "https://github.com/image-rs/image"
categories = ["multimedia::images", "multimedia::encoding", "encoding"]

# Crate build related
exclude = ["src/png/testdata/*", "examples/*", "tests/*"]

include = [
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/CHANGES.md",
    "/src/",
    "/benches/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bytemuck = { version = "1.8.0", features = ["extern_crate_alloc"] } # includes cast_vec
byteorder-lite = "0.1.0"
moxcms = "0.8.0"
num-traits = { version = "0.2.0" }

# Optional dependencies
color_quant = { version = "1.1", optional = true }
gif = { version = "0.14.0", optional = true }
image-webp = { version = "0.2.0", optional = true }
png = { version = "0.18.0", optional = true }
qoi = { version = "0.4", optional = true }
rayon = { version = "1.7.0", optional = true }
tiff = { version = "0.11.2", optional = true }
zune-core = { version = "0.5.0", default-features = false, optional = true }
zune-jpeg = { version = "0.5.5", optional = true }
serde = { version = "1.0.214", optional = true, features = ["derive"] }

[dev-dependencies]
crc32fast = "1.2.0"
num-complex = "0.4"
glob = "0.3"
quickcheck = "1"
criterion = "0.5.0"

[features]
default = ["rayon", "default-formats"]

# Format features
default-formats = ["bmp", "dds", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"]
avif = [] # Deliberately unavailable in the PBrowser dependency profile.
avif-native = [] # Deliberately unavailable in the PBrowser dependency profile.
bmp = []
dds = []
exr = [] # Deliberately unavailable in the PBrowser dependency profile.
ff = [] # Farbfeld image format
gif = ["dep:gif", "dep:color_quant"]
hdr = []
ico = ["bmp", "png"]
jpeg = ["dep:zune-core", "dep:zune-jpeg"]
png = ["dep:png"]
pnm = []
qoi = ["dep:qoi"]
tga = []
tiff = ["dep:tiff"]
webp = ["dep:image-webp"]

# Other features
rayon = ["dep:rayon"] # Enables multi-threading
color_quant = ["dep:color_quant"] # Enables color quantization
benchmarks = [] # Build some inline benchmarks. Useful only during development (requires nightly Rust)
serde = ["dep:serde"]

[[bench]]
path = "benches/decode.rs"
name = "decode"
harness = false

[[bench]]
path = "benches/encode.rs"
name = "encode"
harness = false

[[bench]]
name = "copy_from"
harness = false

[[bench]]
path = "benches/fast_blur.rs"
name = "fast_blur"
harness = false

[[bench]]
path = "benches/blur.rs"
name = "blur"
harness = false

[[bench]]
path = "benches/convert.rs"
name = "convert"
harness = false

# because of https://github.com/image-rs/image/pull/2583
# TODO: remove when shipping the next major release after 0.25
[package.metadata.cargo-semver-checks.lints]
enum_discriminants_undefined_non_unit_variant = { level = "warn" }
